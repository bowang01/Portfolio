spring.application.name=portfolio
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/portfolio?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.connection-timeout=30000

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=48MB
spring.thymeleaf.cache=false
server.servlet.session.timeout=8h
server.forward-headers-strategy=framework
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.upload-dir=${UPLOAD_DIR:./data/uploads}
app.public-host=${APP_HOST:}
