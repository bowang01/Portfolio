<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin login')}"></head>
<body class="auth-body">
<main class="auth-card">
    <p class="eyebrow">Admin</p>
    <h1>Log in</h1>
    <p class="muted">Sign in to add, edit, or delete projects.</p>
    <p class="flash error" th:if="${param.error}">Incorrect username or password.</p>
    <form th:action="@{/admin/login}" method="post" class="form">
        <label>
            Username
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-block" type="submit">Log in</button>
    </form>
    <p class="muted"><a th:href="@{/}">Back to home</a></p>
</main>
</body>
</html>
