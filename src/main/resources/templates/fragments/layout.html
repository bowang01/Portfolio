<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:text="${title} + ' · ' + ${site.displayName}">Portfolio</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <a class="brand" th:href="@{/}" th:text="${site.displayName}">Portfolio</a>
    <nav class="nav">
        <a th:href="@{/}">Home</a>
        <a th:if="${loggedIn}" th:href="@{/admin}">Admin</a>
        <a th:unless="${loggedIn}" th:href="@{/admin/login}">Log in</a>
    </nav>
</header>
<footer class="site-footer" th:fragment="footer">
    <div class="footer-row">
        <p class="footer-note" th:if="${site.footerText}">
            <span class="footer-emoji" aria-hidden="true">📝</span>
            <span th:text="${site.footerText}">Browse the work and open a project for details.</span>
        </p>
        <p class="footer-links muted">
            <a class="footer-link" th:if="${site.email}" th:href="'mailto:' + ${site.email}">
                <span class="footer-emoji" aria-hidden="true">✉️</span>
                <span th:text="${site.email}">email</span>
            </a>
            <a class="footer-link" th:if="${site.githubUrl}" th:href="${site.githubUrl}" target="_blank" rel="noreferrer">
                <span class="footer-emoji" aria-hidden="true">🐙</span>
                <span>GitHub</span>
            </a>
        </p>
    </div>
    <p class="visitor" th:if="${loggedIn and visitCount != null}">
        <span class="footer-emoji" aria-hidden="true">👥</span>
        <span>Visitors: <span th:text="${#numbers.formatInteger(visitCount, 0)}">1</span></span>
    </p>
</footer>
</body>
</html>
