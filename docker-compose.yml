# Domain is not hardcoded. Set APP_HOST in .env or Hostinger / GitHub environment.
# Example: APP_HOST=portfolio.bowang.tech

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-portfolio}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-portfolio_root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - portfolio_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DB_URL: jdbc:mysql://mysql:3306/portfolio?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      DB_USERNAME: portfolio
      DB_PASSWORD: ${MYSQL_PASSWORD:-portfolio}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /app/data/uploads
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env or Hostinger environment}
    volumes:
      - portfolio_uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.portfolio.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls=true
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-http.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.portfolio-http.entrypoints=web
      - traefik.http.services.portfolio.loadbalancer.server.port=8081

volumes:
  portfolio_mysql:
    name: portfolio_mysql
  portfolio_uploads:
    name: portfolio_uploads

networks:
  traefik-proxy:
    name: traefik-proxy
    external: true
